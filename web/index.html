<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サーバー</title>
<meta name="theme-color" id="theme-color" content="#FFFFFF">
<script>
  // テーマ(自動/ライト/ダーク)は描く前に決める。後から変えると開いた瞬間に色がちらつくため(simple-remote-git と同じ)
  (function () {
    var pick = "auto";
    try { pick = localStorage.getItem("theme") || "auto"; } catch (e) {}
    var dark = pick === "dark" || (pick === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.pick = pick;
    document.getElementById("theme-color").content = dark ? "#16191D" : "#FFFFFF";
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サーバー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title">
    <button type="button" id="theme" class="theme-btn" aria-label="テーマを切り替える">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01"/><path d="M7 17.5h.01"/></svg>
      <span id="theme-label" class="theme-label">自動</span>
    </button>
    <div class="names">
      <h1 id="h1">サーバー</h1>
      <p id="sub">my-mac</p>
    </div>
    <button type="button" id="refresh" class="icon-btn" aria-label="今すぐ読み直す">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <div id="status" class="status" data-state="busy" role="status" aria-live="polite">
    <svg class="st-icon st-done" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <svg class="st-icon st-busy" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
    <svg class="st-icon st-err" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>
    <span id="status-text" class="st-text">読み込み中</span>
    <span id="ago" class="ago"></span>
  </div>
</header>

<main id="fav" class="pane"></main>
<main id="new" class="pane" hidden></main>
<main id="tidy" class="pane" hidden></main>

<nav class="tabs" aria-label="タブ">
  <button type="button" data-tab="fav" aria-pressed="true">
    <svg class="on-fill" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>
    <span>お気に入り</span>
  </button>
  <button type="button" data-tab="new" aria-pressed="false">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>新規</span><i id="new-n" class="tab-n" hidden></i>
  </button>
  <button type="button" data-tab="tidy" aria-pressed="false">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
    <span>片付け</span><i id="tidy-n" class="tab-n quiet" hidden></i>
  </button>
</nav>

<div id="layer"></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
